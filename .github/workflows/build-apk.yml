name: Build AFTAB PAK TOOL APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev automake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.37

      - name: Remove Termux-only p4a override
        run: |
          sed -i '/^[[:space:]]*p4a\.source_dir[[:space:]]*=/d' buildozer.spec

      - name: Prepare Android SDK licenses
        run: |
          SDKMANAGER="$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --sdk_root="$HOME/.buildozer/android/platform/android-sdk" \
            "platform-tools" "build-tools;37.0.0"

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AFTAB-PAK-TOOL-APK
          path: bin/*.apk
          if-no-files-found: error
